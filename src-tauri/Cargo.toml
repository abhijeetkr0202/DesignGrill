[package]
name = "designgrill"
version = "0.1.0"
description = "Local-first desktop app for practicing system design interviews."
authors = ["DesignGrill contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.90"

[lib]
name = "designgrill_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.40", features = ["bundled"] }
keyring = "4.2"
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }
tokio = { version = "1", features = ["sync", "time", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
