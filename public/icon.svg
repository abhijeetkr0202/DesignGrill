  <g fill="url(#flame)">
    <path d="M312 772 C318 806 382 822 382 872 C382 904 352 924 312 924 C272 924 242 904 242 872 C242 842 264 828 274 804 C280 826 292 834 302 836 C292 810 304 790 312 772 Z" />
